[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interceptor"
version = "0.1.0"
description = "Approval-gated, tamper-evident evidence for consequential Python function calls."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
]
keywords = ["ai-agents", "approval", "audit", "evidence", "interceptor", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
interceptor = "interceptor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interceptor"]

[tool.hatch.build.targets.sdist]
include = ["src/interceptor", "docs", "README.md", "LICENSE", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=interceptor --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101", # assert is used for invariants here, and throughout the tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
# These files deliberately discuss Unicode lookalikes, so the ambiguous-glyph
# checks are noise here.
"src/interceptor/canonical.py" = ["RUF002", "RUF003"]
"tests/test_redaction_homoglyphs.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_redaction_property.py" = ["RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/interceptor"]
